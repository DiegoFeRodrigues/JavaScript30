<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Array Cardio 💪💪</title>
  <link rel="icon" href="https://fav.farm/🔥" />
</head>
<body>
  <p><em>Psst: have a look at the JavaScript Console</em> 💁</p>
  <script>
    // ## Array Cardio Day 2

    const people = [
      { name: 'Wes', year: 1988 },
      { name: 'Kait', year: 1986 },
      { name: 'Irv', year: 1970 },
      { name: 'Lux', year: 2015 }
    ];

    const comments = [
      { text: 'Love this!', id: 523423 },
      { text: 'Super good', id: 823423 },
      { text: 'You are the best', id: 2039842 },
      { text: 'Ramen is my fav food ever', id: 123523 },
      { text: 'Nice Nice Nice!', id: 542328 }
    ];

    // Some and Every Checks
    // Array.prototype.some() // is at least one person 19 or older?
      console.log("Pelo menos uma pessoa é maior de 19 anos?");

      const anoAtual = new Date().getFullYear();
      const maior19 = people.some(pessoa => anoAtual - pessoa.year >= 19);
      console.log(maior19);

      // js30:
        const maior = people.some(pessoa => (new Date()).getFullYear() - pessoa.year >= 19);
        console.log({maior});

    // Array.prototype.every() // is everyone 19 or older?
      console.log("Todas as pessoas são maiores de 19 anos?");

      const todosMaior = people.every(pessoa => (new Date()).getFullYear() - pessoa.year >= 19);
      console.log({todosMaior});

    // Array.prototype.find()
    // Find is like filter, but instead returns just the one you are looking for
    // find the comment with the ID of 823423
      console.log("Retornando comentário com id = 823423");

      const idProcurado = 823423;

      const encontraID = comments.find(com => com.id == idProcurado);
      console.log(encontraID);
      
    // Array.prototype.findIndex()
    // Find the comment with this ID
    // delete the comment with the ID of 823423
      console.log("Deletando comentário com id = 823423");

      console.log("Array original:");
      console.table(comments);

      comments.splice(comments.findIndex(com => com.id == idProcurado), 1);

      console.log("Array novo:");
      console.table(comments);

      // js30 - criando novo array:
        console.log("js30:");
        const indice = comments.findIndex(com => com.id === idProcurado);
        const novaLista = [
          ...comments.slice(0, indice),
          ...comments.slice(indice + 1)
        ];

        console.log("Array original js30:");
        console.table(comments);

        console.log("Array novo js30:");
        console.table(novaLista);
  </script>
</body>
</html>
